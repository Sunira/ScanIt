name: iOS build & test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in data if "iOS" in r), reverse=True)
          for r in runtimes:
              for d in data[r]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("No iPhone simulator found")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ScanIt.xcodeproj \
            -scheme ScanIt \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning:|Test |\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Summarize errors and warnings
        if: always()
        run: |
          echo "::group::Unique errors"
          grep -E "error:" xcodebuild.log | sed -E 's/^.*\/(ScanIt|ScanItTests)\//\1\//' | sort -u | head -50 || true
          echo "::endgroup::"
          echo "Project warnings:"
          grep -E "warning:" xcodebuild.log | grep -E "/(ScanIt|ScanItTests)/" | sed -E 's/^.*\/(ScanIt|ScanItTests)\//\1\//' | sort -u | head -50 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
