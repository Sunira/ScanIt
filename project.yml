name: ScanIt
options:
  bundleIdPrefix: com.sunira
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or in Xcode) before running on a device.
    DEVELOPMENT_TEAM: ""
targets:
  ScanIt:
    type: application
    platform: iOS
    sources:
      - path: ScanIt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunira.scanit
        PRODUCT_NAME: ScanIt
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScanIt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
  ScanItTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScanItTests
    dependencies:
      - target: ScanIt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunira.scanit.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ScanIt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ScanIt
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ScanIt:
    build:
      targets:
        ScanIt: all
        ScanItTests: [test]
    test:
      targets:
        - ScanItTests
